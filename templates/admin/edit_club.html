{% extends "admin/base.html" %}

{% block title %}Modifier {{ club['name'] }} | GUDLFT Admin{% endblock %}
{% block page_title %}Modifier un club{% endblock %}

{% block content %}
<div class="form-card">
  <p class="form-intro">
    Mettez à jour les informations du club « {{ club['name'] }} ».
  </p>

  <form action="{{ url_for('adminEditClub', club_name=club['name']) }}" method="post" id="form-edit-club">
    <div class="input-group">
      <label for="name">Nom du club</label>
      <input type="text" id="name" name="name" value="{{ club['name'] }}" required />
    </div>

    <div class="input-group">
      <label for="email">Adresse email</label>
      <input type="email" id="email" name="email" value="{{ club['email'] }}" autocomplete="email" required />
    </div>

    <div class="input-group">
      <label for="points">Points disponibles</label>
      <input type="number" id="points" name="points" value="{{ club['points'] }}" min="0" step="1" required />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Enregistrer</button>
      <a href="{{ url_for('adminClubs') }}" class="btn btn-ghost">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
