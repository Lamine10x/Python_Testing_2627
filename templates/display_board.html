<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Classement des points des clubs GUDLFT — Accès public">
  <title>Classement | GUDLFT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { background: var(--bg-2); }

    .board-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 32px 0;
      animation: fadeDown 0.4s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .board-header-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .board-eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-bottom: 6px;
    }

    .board-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .board-public-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: var(--text-subtle);
    }

    .board-public-tag svg { width: 12px; height: 12px; stroke-width: 2; }

    /* TABLE */
    .board-section {
      padding: 28px 0 64px;
      animation: fadeUp 0.4s ease 0.1s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
    }

    thead th {
      padding: 12px 20px;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    thead th:last-child { text-align: right; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }

    tbody tr:last-child { border-bottom: none; }

    tbody tr:hover { background: var(--bg-2); }

    tbody td {
      padding: 15px 20px;
      font-size: 0.9rem;
      color: var(--text);
    }

    .rank-col {
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
      color: var(--text-subtle);
      font-weight: 500;
      width: 52px;
    }

    .rank-medal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px; height: 24px;
      border-radius: 3px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
    }

    .medal-1 { background: #fef9c3; color: #854d0e; border: 1px solid #fde68a; }
    .medal-2 { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .medal-3 { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }

    .name-col { font-weight: 500; }

    .pts-col {
      text-align: right;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .pts-col.top { color: var(--text); }
    .pts-col.rest { color: var(--text-muted); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="{{ url_for('index') }}">GUDLFT</a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Connexion
      </a>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="board-header">
      <div class="container">
        <div class="board-header-inner">
          <div>
            <p class="board-eyebrow">Classement officiel</p>
            <h1 class="board-title">Points des clubs</h1>
          </div>
          <span class="board-public-tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Accès public
          </span>
        </div>
      </div>
    </div>

    <div class="board-section">
      <div class="container">
        <div class="table-container">
          <table id="clubs-table">
            <thead>
              <tr>
                <th>Rang</th>
                <th>Club</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody>
              {% for club in clubs %}
              <tr>
                <td class="rank-col">
                  {% if loop.index == 1 %}
                  <span class="rank-medal medal-1">1</span>
                  {% elif loop.index == 2 %}
                  <span class="rank-medal medal-2">2</span>
                  {% elif loop.index == 3 %}
                  <span class="rank-medal medal-3">3</span>
                  {% else %}
                  {{ loop.index }}
                  {% endif %}
                </td>
                <td class="name-col">{{ club['name'] }}</td>
                <td class="pts-col {% if loop.index <= 3 %}top{% else %}rest{% endif %}">
                  {{ club['points'] }}
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
